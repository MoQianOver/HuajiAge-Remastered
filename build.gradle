plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Patchouli (Blamejared maven)
	maven {
		name = "Blamejared"
		url = "https://maven.blamejared.com"
	}
	maven {
		name = "Modrinth"
		url = "https://api.modrinth.com/maven"
	}
	// Cloth Config (Shedaniel)
	maven {
		name = "Shedaniel"
		url = "https://maven.shedaniel.me/"
	}
	// ModMenu (TerraformersMC)
	maven {
		name = "TerraformersMC"
		url = "https://maven.terraformersmc.com/releases"
	}
	mavenCentral()
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"huajiager" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

}

fabricApi {
	configureDataGeneration {
		client = true
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// Patchouli (Fabric) —— 决策 A2：仅保留 Patchouli，JEI/HWYLA 移除。
	// 经 2026-09-14 排查：fabric.mod.json 中 Patchouli 已从 depends 降为 suggests（非强制前置），
	// 未装载时由客户端 EventPlayerLoggedIn 向聊天栏提示（原版 EventPlayerLoggedIn 语义）；
	// Java 代码无 Patchouli 类直接引用（仅资源与配方），故降为 modCompileOnly：
	// 编译期可见、dev 运行时不强制加载，符合"可选依赖"定位。
	modCompileOnly "vazkii.patchouli:Patchouli:1.20.1-80-FABRIC"

    modCompileOnly "mezz.jei:jei-1.20.1-fabric:15.28.1.170"
    modRuntimeOnly "mezz.jei:jei-1.20.1-fabric:15.28.1.170"

	// Cloth Config + ModMenu —— 可选前置（suggests）：
	// 编译期可见、dev 运行时不强制加载；fabric.mod.json 中仅声明 suggests，
	// 未安装时由 FabricLoader.isModLoaded 分支跳过 Cloth 类加载，游戏正常启动。
	modCompileOnly "me.shedaniel.cloth:cloth-config-fabric:11.1.136"
	modCompileOnly "com.terraformersmc:modmenu:7.2.2"

	implementation "org.graalvm.js:js:23.0.13"
	include "org.graalvm.js:js:23.0.13"
	implementation "org.graalvm.js:js-scriptengine:23.0.13"
	include "org.graalvm.js:js-scriptengine:23.0.13"
	implementation "org.graalvm.sdk:graal-sdk:23.0.13"
	include "org.graalvm.sdk:graal-sdk:23.0.13"
	implementation "org.graalvm.truffle:truffle-api:23.0.13"
	include "org.graalvm.truffle:truffle-api:23.0.13"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
	it.options.compilerArgs += ['-Xdiags:verbose']
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}